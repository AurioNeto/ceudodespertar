name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    # meta é <6min; a folga acima disso é para runners mais lentos, não para acomodar regressão de tempo
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # num pull_request o checkout é o commit de merge; o 1º pai (HEAD^1) é a ponta da base, usada no teto da linha de base
          fetch-depth: 2

      - name: instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: instalar node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm -r typecheck

      - name: lint
        run: pnpm lint

      - name: fronteiras
        run: pnpm fronteiras

      # catraca: falha em violação fora da linha de base versionada (Documento 8, seção 12.2);
      # depois, o shrink-only não pode mudar o arquivo: a linha de base é igual às violações atuais;
      # por fim, num pull_request, a linha de base não pode ter mais entradas que a da base do PR
      - name: fronteiras do web
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          LINHA_DE_BASE=.dependency-cruiser-known-violations.web.json
          pnpm fronteiras:web:catraca
          pnpm fronteiras:web:linha-de-base
          if ! git diff --exit-code -- "$LINHA_DE_BASE"; then
            echo "::error::a linha de base difere do que o shrink-only gera (entrada obsoleta ou arquivo editado à mão): rode pnpm fronteiras:web:linha-de-base e comite"
            exit 1
          fi
          if [ "$EVENTO" = "pull_request" ] && git cat-file -e "HEAD^1:$LINHA_DE_BASE" 2>/dev/null; then
            contar='let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>console.log(JSON.parse(s).length))'
            na_base=$(git show "HEAD^1:$LINHA_DE_BASE" | node -e "$contar")
            no_pr=$(node -e "$contar" < "$LINHA_DE_BASE")
            if [ "$no_pr" -gt "$na_base" ]; then
              echo "::error::a linha de base cresceu de $na_base para $no_pr entradas; ela só pode cair (Documento 8, seção 12.2)"
              exit 1
            fi
          fi

      - name: testes unitarios de contracts
        run: pnpm --filter @cdd/contracts test

      - name: testes unitarios da api
        run: pnpm --filter @cdd/api test

      - name: testes unitarios do web
        run: pnpm --filter @cdd/web test

      - name: build do web
        run: pnpm --filter @cdd/web build

  integracao:
    name: integracao
    runs-on: ubuntu-latest
    # sobe Postgres via Testcontainers (Docker); a folga cobre o pull da imagem no runner
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: instalar node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: testes de integracao da api
        run: pnpm --filter @cdd/api test:integracao

      - name: tipos do kysely batem com o banco migrado
        run: pnpm --filter @cdd/api db:gerar-tipos:verificar

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # medido em ubuntu-latest: ~70s (pull ~11s, Keycloak healthy ~25s, testes ~20s); a folga cobre pull lento e
    # Keycloak travado no healthcheck (o script espera até 300s), sem acomodar regressão de tempo
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: instalar node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile

      # sobe compose num projeto isolado (cdd-aceite-<pid>), compila a API com tsc, migra e roda o aceite real;
      # o trap do script derruba o projeto (down -v) ao sair, inclusive em falha
      - name: aceite real com keycloak
        id: aceite
        env:
          ACEITE_DIRETORIO_DO_LOG: ${{ runner.temp }}/aceite-log
        run: pnpm test:keycloak

      - name: publicar log da api
        if: failure() && steps.aceite.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aceite-log-da-api
          path: ${{ runner.temp }}/aceite-log/api.log
          if-no-files-found: warn
          retention-days: 3
