name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    # meta é <6min; a folga acima disso é para runners mais lentos, não para acomodar regressão de tempo
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: instalar node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm -r typecheck

      - name: lint
        run: pnpm lint

      - name: fronteiras
        run: pnpm fronteiras

      - name: testes unitarios de contracts
        run: pnpm --filter @cdd/contracts test

      - name: testes unitarios da api
        run: pnpm --filter @cdd/api test

      - name: testes unitarios do web
        run: pnpm --filter @cdd/web test

      - name: build do web
        run: pnpm --filter @cdd/web build

  integracao:
    name: integracao
    runs-on: ubuntu-latest
    # sobe Postgres via Testcontainers (Docker); a folga cobre o pull da imagem no runner
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: instalar node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: testes de integracao da api
        run: pnpm --filter @cdd/api test:integracao

      - name: tipos do kysely batem com o banco migrado
        run: pnpm --filter @cdd/api db:gerar-tipos:verificar
