# Ambiente local do CDD (Doc 7 §13, Doc 7 §8, plano B0/F02). Nome de projeto
# fixo porque o worktree do agente muda o nome do diretório a cada execução.
name: cdd

services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA_SUPERUSUARIO}
      CDD_OWNER_SENHA: ${CDD_OWNER_SENHA}
      CDD_APP_SENHA: ${CDD_APP_SENHA}
    ports:
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    volumes:
      - ./infra/postgres/papeis.sql:/cdd/papeis.sql:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docs/sql:/cdd/referencia:ro
      - cdd_postgres_dados:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: durante o init a imagem sobe um servidor temporário só em
      # socket, e o healthcheck não pode dar 'healthy' antes do init acabar.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Substitui MinIO (Doc do plano, risco "MinIO sem imagem community recente"):
  # em set/2026 a imagem `minio/minio` e o cliente `minio/mc` deixaram de
  # existir no Docker Hub, e `quay.io/minio/minio` passou a exigir login.
  # SeaweedFS `server -s3` é S3-compatível, mantido e não exige conta —
  # a porta S3 é o contrato (Doc 6 §11); trocar de novo não muda quem a usa.
  #
  # O filer (porta 8888) não é publicado: sua API HTTP não obedece o
  # s3.json — GET/POST/DELETE anônimos por ali leem, criam e apagam objetos
  # do mesmo bucket que a API S3 (9000) protege por credencial. Confirmado
  # ao vivo (GET 200, POST 201, DELETE 204 sem credencial). Ficar só na rede
  # interna do Compose não tira a utilidade do filer para o container `storage`
  # e para o serviço `storage-bucket` — só tira o acesso de fora.
  storage:
    image: chrislusf/seaweedfs:3.97
    hostname: storage
    environment:
      S3_CHAVE_DE_ACESSO: ${S3_CHAVE_DE_ACESSO}
      S3_SEGREDO: ${S3_SEGREDO}
    entrypoint: ["/bin/sh", "/cdd/iniciar.sh"]
    volumes:
      - ./infra/storage/iniciar.sh:/cdd/iniciar.sh:ro
      - cdd_storage_dados:/dados
    ports:
      - "127.0.0.1:9000:9000" # API S3 (S3_ENDPOINT), com IAM (s3.json)
    healthcheck:
      # Sem IAM (s3.json) a raiz responde 200; com IAM ela vira 403 mesmo com
      # o servidor no ar, então a checagem é só a porta abrir.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 15s

  storage-bucket:
    image: amazon/aws-cli:2.37.4
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_CHAVE_DE_ACESSO}
      AWS_SECRET_ACCESS_KEY: ${S3_SEGREDO}
      AWS_DEFAULT_REGION: ${S3_REGIAO}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "/cdd/criar-bucket.sh"]
    volumes:
      - ./infra/storage/criar-bucket.sh:/cdd/criar-bucket.sh:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:8025:8025" # UI
      - "127.0.0.1:1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

volumes:
  cdd_postgres_dados:
  cdd_storage_dados:
